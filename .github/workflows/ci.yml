name: CI / Security Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-build:
    name: Build Frontend (Svelte 5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

  backend-tests:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and check syntax
        run: python -m compileall -q main.py backend

      - name: Run API & Validation Unit Tests
        run: |
          python -c "
          import asyncio
          import main
          from fastapi import HTTPException
          from starlette.requests import Request
          from pydantic import ValidationError
          from backend.routes import api
          from backend.schemas import CreateSecretRequest

          async def test():
              h = await api.health_check()
              assert h['app'] == 'Tinhat'
              
              # Validate 10k length limit
              try:
                  CreateSecretRequest(text='a' * 10001, lifetime=3600)
                  assert False
              except ValidationError:
                  pass

              # Validate max lifetime limit
              try:
                  CreateSecretRequest(text='test', lifetime=800000)
                  assert False
              except ValidationError:
                  pass

              # Validate demo endpoint removal
              try:
                  await api.get_secret_metadata('demo')
                  assert False
              except HTTPException as e:
                  assert e.status_code == 404

              # Verify secret lifecycle
              scope = {'type': 'http', 'client': ('127.0.0.1', 12345), 'headers': [], 'path': '/api/secrets'}
              req = Request(scope)
              created = await api.create_secret(CreateSecretRequest(text='secret', lifetime=300), req)
              sid = created['id']
              
              meta = await api.get_secret_metadata(sid)
              assert meta['id'] == sid

              acc = await api.accept_secret(sid)
              assert acc['text'] == 'secret'

              # Confirm burn after reading
              try:
                  await api.accept_secret(sid)
                  assert False
              except HTTPException as e:
                  assert e.status_code == 404

          asyncio.run(test())
          "

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tinhat:ci-test

